name: Fetch Price Targets

on:
  workflow_dispatch:
  schedule:
    # Once daily, off the top of the hour — targets don't move intraday.
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch targets
        env:
          SYMBOLS: "TSLA,PLTR,NVDA,CEG,CRWV,NBIS,ZETA,BE,TER,CRWD,DDOG,MRVL,ANET,CDNS,TSM,ASML,AMAT,ZS"
        run: python fetch_targets.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add targets.json
          if git diff --cached --quiet; then
            echo "No changes to targets.json — skipping commit"
          else
            git commit -m "Update targets.json"
            git push
          fi
